<!DOCTYPE html>
<html lang="pt-PT" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>LUCAS ROCHA - Portfolio</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Plyr CSS -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    html { scroll-behavior: smooth; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 8px; }
    ::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.15); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background-color: rgba(255, 255, 255, 0.3); }

    .fade-in-up {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .fade-in-up.visible { opacity: 1; transform: translateY(0); }
    
    .delay-100 { transition-delay: 100ms; }
    .delay-200 { transition-delay: 200ms; }
    .delay-300 { transition-delay: 300ms; }

    .loader-spin { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .loader-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    body {
      background-color: #000;
      color: #fff;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    ::selection { background-color: #fff; color: #000; }

    /* ---------- MÍDIA DO MODAL (vídeo / imagem) ---------- */
    #project-modal-media {
      background-color: #000 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      overflow: hidden;
    }
    #project-modal-media > div.media-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #project-modal-media > div.media-frame {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }
    #project-modal-media iframe {
      position: absolute !important;
      top: 0 !important; left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      background: #000;
    }
    #project-modal-media .plyr {
      width: 100% !important;
      height: 100% !important;
    }
    #project-modal-media .plyr__video-wrapper { height: 100% !important; }
    #project-modal-media video { width: 100% !important; height: 100% !important; object-fit: contain !important; }

    .error-message { color: #ff6b6b; text-align: center; padding: 20px; font-size: 0.9rem; line-height: 1.5; }

    @media (max-width: 768px) {
      #project-modal-box { flex-direction: column !important; }
      #project-modal-media {
        height: 50vh !important; width: 100% !important; min-height: 40vh !important;
      }
      #project-modal-details {
        height: auto !important; max-height: 40vh !important;
        padding: 0.75rem 1rem !important; overflow-y: auto !important;
      }
      #project-modal-title { font-size: 1.25rem !important; margin-bottom: 0.25rem !important; }
      #project-modal-category { font-size: 0.65rem !important; margin-bottom: 0.25rem !important; }
      #project-modal-description {
        font-size: 0.75rem !important; line-height: 1.3 !important; max-height: 2.6rem !important;
        overflow: hidden !important; display: -webkit-box !important; -webkit-line-clamp: 2 !important;
        -webkit-box-orient: vertical !important;
      }
      #project-modal-suggestion { margin-top: 0.25rem !important; padding-top: 0.5rem !important; }
      #project-modal-suggestion h4 { font-size: 0.6rem !important; margin-bottom: 0.25rem !important; }
      #project-modal-suggestion-card { padding: 0.4rem !important; }
      #project-modal-suggestion-card .w-24 { width: 2.5rem !important; height: 2.5rem !important; }
      #project-modal-suggestion-card .pl-4 { padding-left: 0.5rem !important; }
      #project-modal-suggestion-card .text-sm { font-size: 0.65rem !important; }
      #project-modal-suggestion-card .text-[10px] { font-size: 0.55rem !important; }
      #project-modal > button.absolute { width: 2rem !important; height: 2rem !important; top: 0.5rem !important; right: 0.5rem !important; }
    }
  </style>
</head>

  <!-- Plyr JS -->

  <script>
    // =========================================================================
    // CONFIGURAÇÃO E ESTADO GLOBAL
    // =========================================================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbw7lWPgkkVfkX7c44nNI31nNxDE4wGGc_SuXxNF83whucuWTYYlRDVu27b7l5MdpaRZ/exec';

    const DEFAULT_CATEGORIES = ['Nota de Falecimento', 'Igreja', 'Evento', 'Política', 'Comercial', 'Pessoal'];
    const MOCK_PROJECTS = [
      { id: '1', title: 'Campanha Minimalista', category: 'Comercial', type: 'arte', isFeatured: true, imageUrl: 'https://images.unsplash.com/photo-1600607686527-6fb886090705?auto=format&fit=crop&q=80&w=1000', description: 'Uma campanha focada no minimalismo e na clareza da mensagem.', createdAt: Date.now() },
      { id: '2', title: 'Lançamento de Produto', category: 'Evento', type: 'video', isFeatured: true, imageUrl: 'https://images.unsplash.com/photo-1536240478700-b869070f9279?auto=format&fit=crop&q=80&w=1000', videoUrl: '', description: 'Vídeo cinematográfico criado para o lançamento de um produto inovador.', createdAt: Date.now() - 1000 },
      { id: '3', title: 'Identidade Visual', category: 'Política', type: 'arte', isFeatured: false, imageUrl: 'https://images.unsplash.com/photo-1626785774573-4b799315345d?auto=format&fit=crop&q=80&w=1000', description: 'Redesign de identidade visual focada em trazer mais seriedade.', createdAt: Date.now() - 2000 },
      { id: '4', title: 'Ensaio Urbano', category: 'Pessoal', type: 'foto', isFeatured: true, imageUrl: 'https://images.unsplash.com/photo-1511406361295-0a1ff814c0ce?auto=format&fit=crop&q=80&w=1000', description: 'Série de fotografias que capturam a essência do movimento na cidade grande.', createdAt: Date.now() - 3000 },
    ];

    let state = {
      isAdmin: false,
      adminToken: null,
      adminTab: 'dashboard',
      editingProject: null,
      projects: [],
      categories: [],
      designerFilter: 'Todos',
      settings: {
        heroName: 'LUCAS ROCHA',
        heroSubtitle: 'Creative Designer & Visual Architect',
        heroPhrase: 'Transformando ideias complexas em experiências visuais imersivas e inesquecíveis.',
        heroImage: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80&w=2000',
        aboutText: 'Sou um designer apaixonado por criar interfaces e identidades visuais que não apenas parecem bonitas, mas funcionam com perfeição. Com foco no minimalismo e na usabilidade, busco sempre a interseção entre a arte e a tecnologia.',
        email: 'hello@lucasrocha.com',
        instagram: '#',
        whatsapp: '#',
        linkedin: '#',
        contactTitle: 'Vamos conversar.',
        contactSubtitle: 'Tem um projeto em mente? Deixe sua mensagem.'
      }
    };

    let currentPlyr = null;
    let scrollObserver = null;

    document.getElementById('current-year').textContent = new Date().getFullYear();

    // =========================================================================
    // UTILITÁRIOS: ESCAPE, DRIVE, YOUTUBE, CAPAS
    // =========================================================================
    const esc = (s) => String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    const formatDriveUrl = (url) => {
      if (!url) return '';
      // Capas já geradas automaticamente não devem ser alteradas
      if (url.includes('drive.google.com/thumbnail') || url.includes('img.youtube.com') || url.includes('i.ytimg.com')) return url;
      const match = url.match(/(?:id=|v=|d\/|id\/)([a-zA-Z0-9_-]{25,})/);
      if (match && match[1] && url.includes('google')) {
        return `https://lh3.googleusercontent.com/d/${match[1]}`;
      }
      return url;
    };

    function getGoogleDriveFileId(url) {
      if (!url) return null;
      const patterns = [ /\/file\/d\/([a-zA-Z0-9_-]+)/, /[?&]id=([a-zA-Z0-9_-]+)/, /\/d\/([a-zA-Z0-9_-]+)/ ];
      for (const pattern of patterns) {
        const match = url.match(pattern);
        if (match && match[1]) return match[1];
      }
      return null;
    }

    function isGoogleDriveUrl(url) {
      return !!url && (url.includes('drive.google.com') || url.includes('docs.google.com'));
    }

    // Aceita: watch?v=, youtu.be/, shorts/, embed/, live/, m.youtube.com, music.youtube.com
    function getYouTubeId(url) {
      if (!url) return null;
      const m = url.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    function getVideoInfo(url) {
      url = (url || '').trim();
      if (!url) return null;
      const yt = getYouTubeId(url);
      if (yt) return { kind: 'youtube', id: yt };
      if (isGoogleDriveUrl(url)) {
        const id = getGoogleDriveFileId(url);
        return id ? { kind: 'drive', id } : { kind: 'drive-invalid' };
      }
      return { kind: 'file', url };
    }

    // Capa "rápida" (sem testar se existe). Usada para projetos antigos sem capa.
    function getAutoThumb(videoUrl) {
      const info = getVideoInfo(videoUrl);
      if (!info) return '';
      if (info.kind === 'youtube') return `https://img.youtube.com/vi/${info.id}/maxresdefault.jpg`;
      if (info.kind === 'drive') return `https://drive.google.com/thumbnail?id=${info.id}&sz=w1280`;
      return '';
    }

    function probeImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        const t = setTimeout(() => resolve(null), 8000);
        img.onload = () => { clearTimeout(t); resolve(img.naturalWidth > 0 ? img : null); };
        img.onerror = () => { clearTimeout(t); resolve(null); };
        img.src = src;
      });
    }

    // Capa "confiável": testa se a imagem realmente carrega
    async function resolveThumbnail(videoUrl) {
      const info = getVideoInfo(videoUrl);
      if (!info) return '';

      if (info.kind === 'youtube') {
        const maxres = `https://img.youtube.com/vi/${info.id}/maxresdefault.jpg`;
        const hq = `https://img.youtube.com/vi/${info.id}/hqdefault.jpg`;
        const img = await probeImage(maxres);
        // YouTube devolve um placeholder 120x90 quando não existe maxres
        if (img && img.naturalWidth > 320) return maxres;
        return hq;
      }

      if (info.kind === 'drive') {
        const thumb = `https://drive.google.com/thumbnail?id=${info.id}&sz=w1280`;
        const img = await probeImage(thumb);
        return img ? thumb : '';
      }

      return '';
    }

    // Fallback de imagens quebradas (ex.: maxresdefault inexistente)
    window.imgFallback = function(img) {
      if (img.src.includes('maxresdefault')) {
        img.src = img.src.replace('maxresdefault', 'hqdefault');
      } else {
        img.onerror = null;
        img.style.visibility = 'hidden';
      }
    };

    const fetchData = async () => {
      let progress = 0;
      const progressEl = document.getElementById('loader-percentage');
      
      const interval = setInterval(() => {
        progress += Math.floor(Math.random() * 15) + 5;
        if (progress > 95) progress = 95;
        if (progressEl) progressEl.textContent = progress + '%';
      }, 150);

      try {
        const res = await fetch(`${API_URL}?action=getAll`);
        const json = await res.json();
        
        if (json.status === 'success') {
          if (json.data.projects?.length > 0) {
            state.projects = json.data.projects.map(p => {
              let img = formatDriveUrl(p.imageUrl);
              // Projetos de vídeo antigos sem capa: puxa do link automaticamente
              if (!img && p.type === 'video' && p.videoUrl) img = getAutoThumb(p.videoUrl);
              return { ...p, id: String(p.id), imageUrl: img };
            }).sort((a,b) => b.createdAt - a.createdAt);
          } else { state.projects = MOCK_PROJECTS; }
          
          if (json.data.categories?.length > 0) {
            state.categories = json.data.categories.map(c => c.name);
          } else { state.categories = DEFAULT_CATEGORIES; }
          
          if (json.data.settings?.heroName) {
            state.settings = { ...state.settings, ...json.data.settings, heroImage: formatDriveUrl(json.data.settings.heroImage) };
            if (!json.data.settings.whatsapp && json.data.settings.twitter) {
                state.settings.whatsapp = json.data.settings.twitter;
            }
          }
        }
      } catch (err) {
        console.error("Erro ao buscar dados:", err);
        state.projects = MOCK_PROJECTS;
        state.categories = DEFAULT_CATEGORIES;
      } finally {
        clearInterval(interval);
        if (progressEl) progressEl.textContent = '100%';
        setTimeout(() => {
          const loader = document.getElementById('loader');
          loader.classList.add('opacity-0');
          setTimeout(() => {
            loader.classList.add('hidden');
            renderAllSections();
            initScrollyTelling();
            updateGlobalUI();
          }, 500);
        }, 600);
      }
    };

    const apiPost = async (action, payload) => {
      try {
        const body = { action, payload: payload || {}, token: state.adminToken || null };
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          redirect: 'follow',
          body: JSON.stringify(body)
        });
        const json = await res.json();

        if (json.status === 'error' && /sess[ãa]o|login/i.test(json.message || '')) {
          state.isAdmin = false;
          state.adminToken = null;
          sessionStorage.removeItem('admin_token');
          alert('Sua sessão expirou. Faça login novamente.');
          if (state.adminTab) {
            navigate('home');
          }
          openLoginModal();
          return { status: 'error', message: json.message };
        }

        return json;
      } catch (err) {
        throw err;
      }
    };

          const sectionTop = section.offsetTop - navHeight;
          window.scrollTo({ top: sectionTop, behavior: 'smooth' });
        }
      }
    }

    function initScrollyTelling() {
      scrollObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

      document.querySelectorAll('.fade-in-up').forEach(el => scrollObserver.observe(el));

      const sections = document.querySelectorAll('.view-section');
      const navLinks = document.querySelectorAll('.nav-link');

      window.addEventListener('scroll', () => {
        let current = '';
        const scrollPosition = window.scrollY;
        
        sections.forEach(section => {
          const sectionTop = section.offsetTop;
          if (scrollPosition >= (sectionTop - 150)) {
            current = section.getAttribute('id').replace('view-', '');
          }
        });

        navLinks.forEach(link => {
          link.classList.remove('text-white');
          link.classList.add('text-gray-300');
          if (link.dataset.target === current) {
            link.classList.remove('text-gray-300');
            link.classList.add('text-white');
          }
        });
      });
    }

    // --- Preenchimento automático da capa a partir do link do vídeo ---
    function setupCoverAutofill(form, project) {
      const vInput = form.videoUrl;
      const iInput = form.imageUrl;
      const typeSel = form.type;
      const status = document.getElementById('cover-status');
      const previewWrap = document.getElementById('cover-preview-wrap');
      const preview = document.getElementById('cover-preview');
      const btn = document.getElementById('btn-detect-cover');

      const isAutoUrl = (u) => !!u && (u.includes('img.youtube.com') || u.includes('drive.google.com/thumbnail'));
      // 1 = pode ser sobrescrita automaticamente; 0 = o usuário colocou manualmente
      iInput.dataset.auto = (!iInput.value.trim() || isAutoUrl(iInput.value)) ? '1' : '0';

      const updatePreview = () => {
        const v = iInput.value.trim();
        if (v) {
          previewWrap.classList.remove('hidden');
          preview.style.visibility = 'visible';
          preview.src = formatDriveUrl(v);
        } else {
          previewWrap.classList.add('hidden');
        }
      };

      let seq = 0;
      const autoFill = async (force) => {
        const url = vInput.value.trim();
        if (!url) return;
        const info = getVideoInfo(url);
        if (info?.kind === 'youtube' && typeSel.value !== 'video') typeSel.value = 'video';
        if (!force && iInput.value.trim() && iInput.dataset.auto !== '1') return;

        const mine = ++seq;
        status.className = 'text-xs text-gray-500 mt-2 min-h-[1rem]';
        status.textContent = 'Buscando capa do vídeo...';
        const thumb = await resolveThumbnail(url);
        if (mine !== seq) return; // chegou resposta mais nova

        if (thumb) {
          iInput.value = thumb;
          iInput.dataset.auto = '1';
          status.className = 'text-xs text-green-400 mt-2 min-h-[1rem]';
          status.textContent = 'Capa carregada automaticamente ✓';
        } else if (info?.kind === 'file') {
          status.className = 'text-xs text-yellow-400 mt-2 min-h-[1rem]';
          status.textContent = 'Para links diretos (mp4) cole a URL da capa manualmente.';
        } else {
          status.className = 'text-xs text-yellow-400 mt-2 min-h-[1rem]';
          status.textContent = 'Não consegui carregar a capa. Se for do Drive, deixe o vídeo compartilhado como "Qualquer pessoa com o link" ou cole a capa manualmente.';
        }
        updatePreview();
      };

      let timer;
      vInput.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => autoFill(false), 500); });
      vInput.addEventListener('paste', () => { clearTimeout(timer); timer = setTimeout(() => autoFill(false), 150); });
      iInput.addEventListener('input', () => { iInput.dataset.auto = '0'; status.textContent = ''; updatePreview(); });
      btn.addEventListener('click', () => autoFill(true));

      // Ao editar um projeto de vídeo sem capa, já tenta preencher
      if (vInput.value.trim() && !iInput.value.trim()) autoFill(false);
    }

    async function handleProjectSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('button[type="submit"]');
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Salvando...';

      try {
        const videoUrl = form.videoUrl.value.trim();
        let imageUrl = form.imageUrl.value.trim();

        // Se não tem capa e tem link de vídeo, busca a capa antes de salvar
        if (!imageUrl && videoUrl) {
          imageUrl = await resolveThumbnail(videoUrl);
          if (!imageUrl) imageUrl = getAutoThumb(videoUrl);
        }

        const projectData = {
          id: String(state.editingProject?.id || Date.now()),
          title: form.title.value,
          category: form.category.value,
          type: form.type.value,
          isFeatured: form.isFeatured.checked,
          imageUrl: imageUrl,       // <- a capa é salva na planilha
          videoUrl: videoUrl,
          description: form.description.value,
          createdAt: state.editingProject?.createdAt || Date.now(),
          updatedAt: Date.now()
        };

        const result = await apiPost('saveProject', projectData);
        if (result && result.status === 'error') {
          alert(result.message || 'Erro ao salvar o projeto.');
          return;
        }

        if (state.editingProject) {
          const index = state.projects.findIndex(p => String(p.id) === String(state.editingProject.id));
          if (index !== -1) state.projects[index] = projectData;
        } else {
          state.projects.unshift(projectData);
        }

        setAdminTab('edit');
        renderAllSections();
      } catch (err) {
        alert('Erro ao salvar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    // --- YouTube: carrega o iframe no toque e usa a IFrame API só para detectar erros ---
    let ytApiPromise = null;
    function loadYouTubeApi() {
      if (ytApiPromise) return ytApiPromise;
      ytApiPromise = new Promise((resolve, reject) => {
        if (window.YT && window.YT.Player) return resolve();
        const prev = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = () => { if (typeof prev === 'function') prev(); resolve(); };
        const t = document.createElement('script');
        t.src = 'https://www.youtube.com/iframe_api';
        t.onerror = () => { ytApiPromise = null; reject(new Error('api')); };
        document.head.appendChild(t);
        setTimeout(() => reject(new Error('timeout')), 10000);
      });
      return ytApiPromise;
    }

    function showYouTubeFallback(frame, videoId) {
      if (!frame) return;
      frame.innerHTML = `
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#000;">
          <img src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0.35;" />
          <p style="position:relative;color:#fff;font-size:14px;line-height:1.4;max-width:280px;">Este navegador bloqueou o player incorporado do YouTube.</p>
          <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" rel="noopener"
             style="position:relative;background:#fff;color:#000;font-weight:600;font-size:14px;padding:12px 22px;border-radius:9999px;text-decoration:none;">Assistir no YouTube</a>
        </div>`;
    }

    function startYouTube(videoId, title) {
      const frame = document.getElementById('yt-frame');
      if (!frame) return;
      const origin = /^https?:$/.test(location.protocol) ? `&origin=${encodeURIComponent(location.origin)}` : '';
      // o iframe é criado direto no toque (exigência de autoplay do iOS)
      frame.innerHTML = `
        <iframe id="yt-iframe"
          src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&playsinline=1&rel=0&enablejsapi=1${origin}"
          title="${esc(title)}"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen></iframe>`;
      loadYouTubeApi().then(() => {
        const el = document.getElementById('yt-iframe');
        if (!el) return;
        new YT.Player(el, { events: { onError: () => showYouTubeFallback(document.getElementById('yt-frame'), videoId) } });
      }).catch(() => { /* sem API: o player segue funcionando normalmente */ });
    }

    // --- Monta o player conforme o tipo de link (YouTube / Drive / arquivo direto) ---
    function buildVideoPlayer(project, mediaContainer) {
      const info = getVideoInfo(project.videoUrl);
      const fallbackLink = project.videoUrl
        ? `<br><a href="${esc(project.videoUrl)}" target="_blank" rel="noopener" class="underline text-white">Abrir vídeo em nova aba</a>`
        : '';

      if (!info) return false;

      if (info.kind === 'youtube') {
        const watchUrl = `https://www.youtube.com/watch?v=${info.id}`;
        mediaContainer.innerHTML = `
          <div class="media-frame" id="yt-frame">
            <img src="https://img.youtube.com/vi/${info.id}/hqdefault.jpg" alt="${esc(project.title)}"
                 style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;" />
            <button type="button" id="yt-play-btn" aria-label="Reproduzir vídeo"
                    style="position:absolute;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.25);border:0;cursor:pointer;">
              <span style="width:80px;height:80px;border-radius:9999px;background:rgba(255,255,255,0.92);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(0,0,0,0.5);">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="#000" style="margin-left:4px"><path d="M8 5v14l11-7z"/></svg>
              </span>
            </button>
            <a href="${watchUrl}" target="_blank" rel="noopener"
               style="position:absolute;left:12px;bottom:10px;font-size:11px;color:rgba(255,255,255,0.7);text-decoration:underline;z-index:2;">Abrir no YouTube</a>
          </div>`;
        document.getElementById('yt-play-btn').addEventListener('click', () => startYouTube(info.id, project.title));
        return true;
      }

      if (info.kind === 'drive') {
        mediaContainer.innerHTML = `
          <div class="media-frame">
            <iframe
              src="https://drive.google.com/file/d/${info.id}/preview"
              title="${esc(project.title)}"
              allow="autoplay; fullscreen"
              allowfullscreen></iframe>
          </div>`;
        return true;
      }

      if (info.kind === 'drive-invalid') {
        mediaContainer.innerHTML = `<div class="error-message">Link do Google Drive inválido.${fallbackLink}</div>`;
        return true;
      }

      // Arquivo direto (mp4, webm...)
      mediaContainer.innerHTML = `
        <div class="media-wrap">
          <video id="plyr-video" controls playsinline preload="metadata" poster="${esc(project.imageUrl)}" style="width:100%; height:100%; object-fit:contain;">
            <source src="${esc(info.url)}">
          </video>
        </div>`;
      setTimeout(() => {
        const playerElement = document.getElementById('plyr-video');
        if (playerElement && window.Plyr) {
          currentPlyr = new Plyr(playerElement, { controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'pip', 'fullscreen'] });
        }
      }, 100);
      return true;
    }

    window.openProjectModal = function(id) {
      const project = state.projects.find(p => String(p.id) === String(id));
      if (!project) return;

      const modal = document.getElementById('project-modal');
      const box = document.getElementById('project-modal-box');
      const mediaContainer = document.getElementById('project-modal-media');

      document.getElementById('project-modal-category').textContent = project.category;
      document.getElementById('project-modal-title').textContent = project.title;
      document.getElementById('project-modal-description').textContent = project.description || '';

      if (currentPlyr) { currentPlyr.destroy(); currentPlyr = null; }
      mediaContainer.innerHTML = '';

      let rendered = false;
      if (project.type === 'video' && project.videoUrl) {
        rendered = buildVideoPlayer(project, mediaContainer);
      }
      if (!rendered) {
        mediaContainer.innerHTML = `<div class="media-wrap"><img src="${esc(project.imageUrl)}" class="max-w-full max-h-full object-contain rounded-2xl" onerror="imgFallback(this)"/></div>`;
      }

      const suggestionContainer = document.getElementById('project-modal-suggestion');
      const suggestionCard = document.getElementById('project-modal-suggestion-card');
      const suggestedProject = state.projects.find(p => String(p.id) !== String(id) && p.category === project.category);
      
      if (suggestedProject) {
        suggestionContainer.classList.remove('hidden');
        suggestionCard.innerHTML = `<div class="w-24 h-24 flex-shrink-0 bg-black rounded-xl overflow-hidden"><img src="${esc(suggestedProject.imageUrl)}" class="w-full h-full object-cover" onerror="imgFallback(this)"/></div><div class="flex-1 pl-4"><span class="text-[10px] uppercase text-gray-500">${esc(suggestedProject.category)}</span><h5 class="text-sm font-medium">${esc(suggestedProject.title)}</h5></div>`;
        suggestionCard.onclick = () => openProjectModal(suggestedProject.id);
      } else {
        suggestionContainer.classList.add('hidden');
      }

      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        box.classList.remove('scale-95');
        box.classList.add('scale-100');
      }, 10);
    };

    window.closeProjectModal = function() {
      const modal = document.getElementById('project-modal');
      const box = document.getElementById('project-modal-box');
      if (currentPlyr) { currentPlyr.destroy(); currentPlyr = null; }
      modal.classList.add('opacity-0');
      box.classList.remove('scale-100');
      box.classList.add('scale-95');
      // esvazia a mídia para parar o áudio/vídeo do iframe
      setTimeout(() => { modal.classList.add('hidden'); document.getElementById('project-modal-media').innerHTML = ''; }, 300);
    };

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !document.getElementById('project-modal').classList.contains('hidden')) closeProjectModal();
    });

    function toggleMobileMenu() {
      const menu = document.getElementById('mobile-menu');
      const icon = document.getElementById('mobile-menu-icon');
      if (menu.classList.contains('hidden')) {
        menu.classList.remove('hidden');
        icon.setAttribute('data-lucide', 'x');
        lucide.createIcons();
        setTimeout(() => { menu.classList.remove('h-0', 'opacity-0'); menu.classList.add('h-auto', 'opacity-100'); }, 10);
      } else { closeMobileMenu(); }
    }

    function closeMobileMenu() {
      const menu = document.getElementById('mobile-menu');
      const icon = document.getElementById('mobile-menu-icon');
      if (!menu.classList.contains('hidden')) {
        menu.classList.add('opacity-0');
        icon.setAttribute('data-lucide', 'menu');
        lucide.createIcons();
        setTimeout(() => { menu.classList.add('hidden', 'h-0'); menu.classList.remove('h-auto'); }, 300);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const savedToken = sessionStorage.getItem('admin_token');
      if (savedToken) {
        state.adminToken = savedToken;
        state.isAdmin = true;
      }

      lucide.createIcons();
      fetchData();
    });
  </script>
</body>
</html>
